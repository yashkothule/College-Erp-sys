<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View Students — College ERP Management System">
    <title>View Students &mdash; College ERP</title>

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <script>if (localStorage.getItem('erp_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
</head>

<body>

    <div class="erp-wrapper">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <div class="erp-main" id="erpMain">
            <!-- Navbar -->
            <div id="navbar-container"></div>

            <main class="erp-content" id="mainContent">

                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1>&#128107; View Students</h1>
                        <p class="text-muted" style="font-size:var(--font-size-sm); margin-top:3px">
                            Directory of all active and pending students.
                        </p>
                    </div>
                    <a href="add-student.html" class="btn btn-primary">
                        &#43; Add Student
                    </a>
                </div>

                <div class="card">
                    <div class="card-header" style="display:flex; gap:16px; flex-wrap:wrap;">

                        <!-- Search & Filter Controls -->
                        <div class="filter-bar" style="margin-bottom:0; flex:1;">
                            <div class="search-box">
                                <span class="search-icon">&#128269;</span>
                                <input type="text" id="studentSearch"
                                    placeholder="Search by name, roll no or department...">
                            </div>
                        </div>

                        <select class="form-control" id="deptFilter"
                            style="width: auto; padding: 8px 12px; font-size: var(--font-size-sm);">
                            <option value="All">All Departments</option>
                            <option value="MCA">MCA</option>
                            <option value="BCA">BCA</option>
                            <option value="MBA">MBA</option>
                        </select>

                    </div>

                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="erp-table" id="studentsTable">
                                <thead>
                                    <tr>
                                        <th>Roll No.</th>
                                        <th>Student Name</th>
                                        <th>Department</th>
                                        <th>Sem</th>
                                        <th>Email</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsTableBody">
                                    <tr>
                                        <td colspan="7" style="text-align:center; padding: 2rem;">Loading students...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="card-body"
                        style="border-top: 1px solid var(--border-color); padding-top: 12px; padding-bottom: 12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="text-muted" id="totalCountSpan" style="font-size:var(--font-size-sm)">Showing 1
                                to 5 of 248 entries</span>
                            <div class="pagination" style="margin-top:0;">
                                <button disabled>&laquo;</button>
                                <button class="active">1</button>
                                <button>2</button>
                                <button>3</button>
                                <button>&raquo;</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Edit Student Modal -->
                <div id="editStudentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
                    <div class="card" style="width:100%; max-width:600px; padding:20px; position:relative; max-height: 90vh; overflow-y: auto;">
                        <button onclick="closeEditModal()" style="position:absolute; top:15px; right:20px; background:transparent; border:none; font-size:20px; cursor:pointer;">&times;</button>
                        <h3 style="margin-top:0;">Edit Student: <span id="editStuIdBadge" class="badge badge-primary"></span></h3>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">
                        
                        <form id="editStudentForm">
                            <input type="hidden" id="editStuId">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label" for="editName">Full Name</label>
                                    <input type="text" class="form-control" id="editName" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="editEmail">Email Address</label>
                                    <input type="email" class="form-control" id="editEmail" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="editProgram">Department</label>
                                    <select class="form-control" id="editProgram" required>
                                        <option value="MCA">MCA</option>
                                        <option value="BCA">BCA</option>
                                        <option value="MBA">MBA</option>
                                        <option value="BScIT">B.Sc. IT</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="editSemester">Semester</label>
                                    <select class="form-control" id="editSemester" required>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="editStatus">Status</label>
                                    <select class="form-control" id="editStatus" required>
                                        <option value="active">Active</option>
                                        <option value="pending">Pending</option>
                                    </select>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                                <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                                <button type="submit" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>

            <!-- Footer -->
            <div id="footer-container"></div>
        </div>
    </div>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        initERPComponents({
            root: '../../',
            pageTitle: 'Student Directory',
            breadcrumb: 'Students > View',
            userRole: 'Admin'
        });

        // Initialize Table Search
        // Search within Roll No (0), Name (1), Dept (2), Email (4)
        setTimeout(() => {
            if (typeof initTableSearch === 'function') {
                initTableSearch('studentSearch', 'studentsTable', [0, 1, 2, 4]);
            }
        }, 100);

        // Department Filter
        document.getElementById('deptFilter').addEventListener('change', function () {
            const filterText = this.value === 'All' ? '' : this.value.toLowerCase();
            const rows = document.querySelectorAll('#studentsTable tbody tr');

            rows.forEach(row => {
                const deptText = row.querySelector('td:nth-child(3)').textContent.toLowerCase();
                if (filterText === '' || deptText.includes(filterText)) {
                    // If it passes this filter, we also must check if it passes search filter
                    // However, for simplicity in mockup:
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });

        // Load students from backend
        async function loadStudents() {
            try {
                const res = await fetch('http://localhost:5000/api/users?role=student');
                const data = await res.json();
                const students = data.data || [];

                const tbody = document.getElementById('studentsTableBody');
                tbody.innerHTML = '';

                if (students.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center">No students found.</td></tr>`;
                } else {
                    students.forEach(s => {
                        const badgeColor = s.status === 'active' ? 'success' : (s.status === 'pending' ? 'warning' : 'danger');
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${s.id}</td>
                            <td>${s.name}</td>
                            <td>${s.program || 'N/A'}</td>
                            <td>${s.semester || 'N/A'}</td>
                            <td>${s.email}</td>
                            <td><span class="badge badge-${badgeColor}">${s.status.charAt(0).toUpperCase() + s.status.slice(1)}</span></td>
                            <td>
                                <div style="display:flex; gap:6px;">
                                    <button class="btn btn-sm btn-outline text-primary" title="Edit"
                                        onclick="openEditModal('${s.id}')">&#9998;</button>
                                    <button class="btn btn-sm btn-outline text-danger" title="Delete"
                                        onclick="deleteStudent('${s.id}')">&#128465;</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                document.getElementById('totalCountSpan').textContent = `Showing 1 to ${students.length} of ${students.length} entries`;
            } catch (err) {
                console.error("Error loading students:", err);
                const tbody = document.getElementById('studentsTableBody');
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Failed to retrieve data from backend.</td></tr>`;
            }
        }

        // Initialize on load
        loadStudents();

        // Authentic Delete function
        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student record? This action cannot be undone.')) {
                try {
                    const res = await fetch(`http://localhost:5000/api/users/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        ERP_Toast.show('Student record deleted.', 'success');
                        loadStudents(); // re-render
                    } else {
                        const data = await res.json();
                        ERP_Toast.show(data.message || 'Error deleting student', 'error');
                    }
                } catch (err) {
                    console.error("Error deleting student:", err);
                    ERP_Toast.show('Network error. Backend not reachable.', 'error');
                }
            }
        }

        // Inline Modal Edit logic
        async function openEditModal(id) {
            try {
                const res = await fetch(`http://localhost:5000/api/users/${id}`);
                if (!res.ok) throw new Error("Student not found");
                const data = await res.json();
                const student = data.data;

                document.getElementById('editStuId').value = student.id;
                document.getElementById('editStuIdBadge').textContent = student.id;
                document.getElementById('editName').value = student.name;
                document.getElementById('editEmail').value = student.email || '';
                document.getElementById('editProgram').value = student.program || 'MCA';
                document.getElementById('editSemester').value = student.semester || '1';
                document.getElementById('editStatus').value = student.status || 'active';

                document.getElementById('editStudentModal').style.display = 'flex';
            } catch (err) {
                console.error("Error fetching student details:", err);
                ERP_Toast.show('Error loading student data.', 'error');
            }
        }

        function closeEditModal() {
            document.getElementById('editStudentModal').style.display = 'none';
        }

        document.getElementById('editStudentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveEditBtn');
            const origText = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const id = document.getElementById('editStuId').value;
            const payload = {
                name: document.getElementById('editName').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                program: document.getElementById('editProgram').value,
                semester: document.getElementById('editSemester').value,
                status: document.getElementById('editStatus').value
            };

            try {
                const res = await fetch(`http://localhost:5000/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    ERP_Toast.show('Student updated successfully!', 'success');
                    closeEditModal();
                    loadStudents(); // Refresh table
                } else {
                    const data = await res.json();
                    ERP_Toast.show(data.message || 'Error updating student', 'error');
                }
            } catch (err) {
                console.error("Error updating student:", err);
                ERP_Toast.show('Network error. Backend not reachable.', 'error');
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
