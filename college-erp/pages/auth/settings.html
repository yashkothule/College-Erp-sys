<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Settings — College ERP Management System">
    <title>Settings &mdash; College ERP</title>

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>

<body>

    <div class="erp-wrapper">
        <div id="sidebar-container"></div>

        <div class="erp-main" id="erpMain">
            <div id="navbar-container"></div>

            <main class="erp-content" id="mainContent">

                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1>&#9881; Settings</h1>
                        <p class="text-muted" style="font-size:var(--font-size-sm); margin-top:3px">
                            Manage your app preferences and settings.
                        </p>
                    </div>
                </div>

                <div class="card" style="max-width: 900px; margin: 0 auto;">
                    <div class="card-header">
                        <h3>General Preferences</h3>
                    </div>
                    <div class="card-body">
                        <form id="settingsForm">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label" for="themeSelect">Application Theme</label>
                                    <select class="form-control" id="themeSelect">
                                        <option value="light" selected>Light Mode</option>
                                        <option value="dark">Dark Mode</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" style="margin-top:20px;">
                                <label class="checkbox-label" style="display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" checked id="emailNotifs">
                                    Enable Email Notifications
                                </label>
                            </div>
                            <div class="form-group" style="margin-top:10px;">
                                <label class="checkbox-label" style="display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" checked id="sysNotifs">
                                    Enable System Notifications
                                </label>
                            </div>

                            <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                                <button type="button" class="btn btn-primary"
                                    onclick="ERP_Toast.show('Settings saved successfully!', 'success')">Save
                                    Settings</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>

            <div id="footer-container"></div>
        </div>
    </div>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        initERPComponents({
            root: '../../',
            pageTitle: 'Settings',
            breadcrumb: 'Settings',
            userRole: JSON.parse(sessionStorage.getItem('erp_user') || '{}').role || 'Student'
        }).then(() => {
            // Theme setup
            const themeSelect = document.getElementById('themeSelect');
            const currentTheme = localStorage.getItem('erp_theme') || 'light';
            themeSelect.value = currentTheme;

            themeSelect.addEventListener('change', (e) => {
                const newTheme = e.target.value;
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('erp_theme', newTheme);
            });
        });
    </script>
</body>

</html>
