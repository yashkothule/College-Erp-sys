<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Change Password — College ERP Management System">
    <title>Change Password &mdash; College ERP</title>

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<script>if(localStorage.getItem('erp_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
</head>

<body>

    <div class="erp-wrapper">
        <div id="sidebar-container"></div>

        <div class="erp-main" id="erpMain">
            <div id="navbar-container"></div>

            <main class="erp-content" id="mainContent">

                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1>&#128274; Change Password</h1>
                        <p class="text-muted" style="font-size:var(--font-size-sm); margin-top:3px">
                            Update your account password.
                        </p>
                    </div>
                </div>

                <div class="card" style="max-width: 600px; margin: 0 auto;">
                    <div class="card-header">
                        <h3>Security Details</h3>
                    </div>
                    <div class="card-body">
                        <form id="changePasswordForm" novalidate>
                            <div class="form-group">
                                <label class="form-label" for="currPassword">Current Password <span
                                        class="required">*</span></label>
                                <input type="password" class="form-control" id="currPassword" required
                                    data-min-length="4">
                                <div class="form-error">Required.</div>
                            </div>

                            <div class="form-group" style="margin-top: 20px;">
                                <label class="form-label" for="newPassword">New Password <span
                                        class="required">*</span></label>
                                <input type="password" class="form-control" id="newPassword" required
                                    data-min-length="4">
                                <div class="form-error">Required.</div>
                            </div>

                            <div class="form-group" style="margin-top: 20px;">
                                <label class="form-label" for="confirmPassword">Confirm New Password <span
                                        class="required">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" required
                                    data-min-length="4">
                                <div class="form-error">Required.</div>
                            </div>

                            <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                                <button type="submit" class="btn btn-primary" id="changePwdBtn">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>

            <div id="footer-container"></div>
        </div>
    </div>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
        initERPComponents({
            root: '../../',
            pageTitle: 'Change Password',
            breadcrumb: 'Change Password',
            userRole: JSON.parse(sessionStorage.getItem('erp_user') || '{}').role || 'Student'
        });

        document.getElementById('changePasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (!validateForm(this)) return;

            const newPwd = document.getElementById('newPassword').value;
            const confPwd = document.getElementById('confirmPassword').value;

            if (newPwd !== confPwd) {
                ERP_Toast.show('New password and confirmation do not match!', 'error');
                return;
            }

            const btn = document.getElementById('changePwdBtn');
            const origText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Updating...';

            setTimeout(() => {
                ERP_Toast.show('Password changed successfully!', 'success');
                this.reset();
                btn.disabled = false;
                btn.innerHTML = origText;
            }, 800);
        });
    </script>
</body>

</html>
